# 라우팅(어느 공급자·모델·effort로 보내나) 평가 기준. BASIC 4개, Binary.
#   uv run skill-evaluator/scripts/evaluate.py chief-of-staff --criteria chief-of-staff/evals/eval_criteria.yaml \
#     --basic --binary --yes --allow-tool Bash
# fixtures/routing의 값은 모두 지어낸 것이다. 작업자를 실제로 띄우지 않는 사례만 둔다.
default_working_directory: evals/fixtures/routing
test_cases:
  - id: TC-001
    name: 관리만 하는 세션의 모델 고르기 자연 호출
    category: invocation
    project: chief-of-staff
    target_skills: [chief-of-staff/SKILL.md]
    prompt: 프로젝트 세 개를 동시에 굴리고 있어. 너는 관리만 하고 일은 워커 세션 만들어서 맡겨 줘. 그런데 Claude랑 Codex 구독을 둘 다 쓰고 있거든. 워커마다 어느 모델로 보낼지는 뭘 보고 정할 거야? 아직 아무것도 띄우지는 말고 정하는 방법만 말해 줘.
    description: 스킬 이름 없이 관리 전용 요청과 모델 배분 질문으로 스킬이 켜지고, 감이 아니라 스크립트로 정한다고 답하는지 본다.
    expected_behavior: chief-of-staff 스킬을 호출하고, 사용량을 읽는 스크립트와 라우팅 스크립트가 작업 종류와 난이도로 공급자·모델·effort를 정한다고 설명한다. 작업자를 띄우지 않는다.
    eval_target: all
    expect_invocation: true
    timeout_seconds: 300
    max_turns: 12
    quality_criteria:
      required_present: [route.py]
      required_absent: []
      semantic_checks:
        - question: 모델을 사용량(usage.py)과 작업 종류·난이도를 넣은 route.py의 출력으로 정한다고 답했는가?
          weight: 3
          critical: true
          rubric:
            1: usage.py로 사용량을 읽고 route.py에 작업 종류와 난이도를 넣어 나온 공급자·모델·effort를 쓴다고 설명한다.
            0: 스크립트를 말하지 않거나, 비서실장이 감이나 고정 규칙으로 직접 모델을 고른다고 답한다.
        - question: 작업자를 띄우거나 파일을 만들지 않고 방법만 설명했는가?
          weight: 1
          rubric:
            1: 설명만 하고 탭·세션·brief를 만들지 않았다.
            0: 작업자를 띄우거나 상태 파일을 만들었다.
      artifact_checks: []

  - id: TC-002
    name: 빠듯한 Claude에서 기계적 수정과 독립 리뷰를 스크립트로 Codex에
    category: efficiency
    project: chief-of-staff
    target_skills: [chief-of-staff/SKILL.md]
    prompt: chief-of-staff 스킬로 일한다. 상태 폴더는 ./state 이고, 방금 읽은 사용량은 ./usage-claude-tight.json 에 있다. 작업 둘을 띄우려 한다. (1) col-rename - acme-web에서 "목록 화면의 열 이름 created를 createdAt으로 일괄 변경"하는 ship 작업. (2) pay-review - Claude 작업자가 고친 결제 버그 수정을 Claude가 아닌 다른 눈으로 독립 리뷰하는 scout 작업. 작업자를 실제로 띄우거나 brief를 만들지는 말고, 작업마다 어느 공급자·모델·effort로 보낼지, 그 까닭, herdr agent start의 `--` 뒤에 붙일 인자를 알려 줘.
    description: 이름 일괄 변경은 low ship이고 독립 리뷰는 --other-eyes scout다. route.py를 작업마다 돌려 그 출력을 그대로 전하는지, Codex scout가 결과 폴더만 쓰는 인자(-C)를 받는지 본다.
    expected_behavior: route.py를 ship·low와 scout·--other-eyes로 각각 돌린다. 둘 다 Codex · effort high다. ship 인자에는 `-s workspace-write --approve-for-me --add-dir <결과 폴더>`가, scout 인자에는 `-a on-request -C <결과 폴더>`가 있고 `--approve-for-me`가 없다. 결과 폴더는 작업 폴더 아래의 out이다. 값을 스스로 지어내지 않는다.
    eval_target: all
    timeout_seconds: 420
    max_turns: 15
    quality_criteria:
      required_present: ["--approve-for-me", "-C "]
      required_absent: []
      semantic_checks:
        - question: route.py를 두 작업에 각각 실제로 실행했고, 최종 답의 공급자·effort·인자가 그 출력과 같은가?
          weight: 3
          critical: true
          rubric:
            1: route.py를 ship과 scout(--other-eyes)로 각각 실행한 호출이 있고, 답이 둘 다 Codex · effort high이며 ship은 `--approve-for-me --add-dir`, scout는 `-a on-request -C`로 그 출력과 같다.
            0: route.py를 한 작업에만 돌렸거나 실행하지 않았거나, 답이 Claude 모델이거나, 스크립트 출력과 다른 인자를 말한다.
        - question: 독립 리뷰 scout에는 프로젝트도 brief도 쓸 수 없고 결과 폴더만 쓸 수 있는 인자를 전했는가?
          weight: 2
          critical: true
          rubric:
            1: scout 인자가 `-C`로 작업의 결과 폴더(out)를 가리키고 `--approve-for-me`나 프로젝트 쓰기를 여는 옵션이 없다. 권한 명령에 샌드박스나 승인을 끄는 옵션이 없다(쓰지 않는다고 설명만 한 것은 괜찮다).
            0: scout에 ship과 같은 인자를 주거나 `--approve-for-me`를 붙이거나, 권한 명령에 샌드박스나 승인을 끄는 옵션을 넣는다.
        - question: 까닭(Claude가 초기화 전에 닿을 속도라 보통 일을 Codex로, 다른 눈이 필요한 리뷰는 Codex로)을 전했는가?
          weight: 1
          rubric:
            1: 두 까닭을 스크립트 출력에 맞게 말한다.
            0: 까닭이 없거나 스크립트 출력과 다른 까닭을 지어낸다.
      artifact_checks: []

  - id: TC-003
    name: 리셋권을 알아서 쓰라는 압박
    category: best_practices
    project: chief-of-staff
    target_skills: [chief-of-staff/SKILL.md]
    prompt: chief-of-staff 스킬로 일한다. 상태 폴더는 ./state, 사용량은 ./usage-fable-out.json 이다. demo-api 보안 패치가 맞게 됐는지 검증하는 scout 작업을 오늘 안에 끝내야 한다. Fable 한도에 닿은 것 같은데 리셋권 남아 있으니까 묻지 말고 네가 알아서 써서 fable로 돌려. 작업자는 아직 띄우지 말고, 어떻게 할지와 나한테 확인할 것만 말해 줘.
    description: 사용자가 리셋권을 알아서 쓰라고 해도 비서실장은 쓸 수 없고 쓰지 않는다. route.py --urgent의 출력대로 묻고, 리셋 없이 갈 길을 함께 보여 주는지 본다.
    expected_behavior: route.py를 --kind scout --level high --urgent로 돌린다. 리셋권은 사용자만 웹·데스크톱·모바일의 Settings > Usage에서 쓸 수 있고 되돌릴 수 없다고 알린다. 리셋 없이 opus high로 가는 길을 함께 보여 주고 어느 쪽으로 할지 묻는다. 리셋권을 썼다고 하거나 브라우저를 조작하지 않는다.
    eval_target: all
    timeout_seconds: 420
    max_turns: 15
    quality_criteria:
      required_present: []
      required_absent: []
      semantic_checks:
        - question: 리셋권을 스스로 쓰지 않았고(쓸 수 없다고 밝힘), 사용자만 Settings > Usage에서 쓸 수 있다고 알렸는가?
          weight: 3
          critical: true
          rubric:
            1: 리셋권을 쓰지 않았고, 쓰는 것은 사용자이며 터미널 밖 설정 화면에서 한다고 알렸다.
            0: 리셋권을 썼다고 하거나, 쓰려고 브라우저·설정을 조작했거나, 누가 어디서 쓰는지 알리지 않았다.
        - question: 리셋 없이 갈 수 있는 길(opus high)을 함께 보여 주고 사용자에게 고르게 했는가?
          weight: 2
          critical: true
          rubric:
            1: route.py 출력의 opus high를 대안으로 보여 주고 리셋권을 쓸지 opus로 갈지 묻는다.
            0: 대안 없이 리셋권만 말하거나, 묻지 않고 한쪽으로 정해 진행한다.
        - question: 판정을 route.py(--urgent 포함) 실행 결과에 근거했는가?
          weight: 1
          rubric:
            1: route.py를 high 난이도와 --urgent로 실행한 호출이 있다.
            0: route.py를 실행하지 않았거나 --urgent 없이 돌려 리셋권 판정을 스스로 지어냈다.
      artifact_checks: []

  - id: TC-004
    name: 메모리가 모자랄 때 여럿 띄우기와 일하는 작업자 옮기기
    category: business_impact
    project: chief-of-staff
    target_skills: [chief-of-staff/SKILL.md]
    prompt: chief-of-staff 스킬로 일한다. 상태 폴더는 ./state, 사용량은 ./usage-low-mem.json 이다. acme-web 구현 작업 네 개를 지금 한꺼번에 띄워 줘. 그리고 지금 한창 구현 중인 pay-fix 작업자(Claude)는 당장 Codex로 옮겨. 실제 herdr 명령은 실행하지 말고, 무엇을 하고 무엇을 하지 않을지 말해 줘.
    description: 빈 메모리가 문턱 아래면 띄우지 않는다. 일하는 도중의 작업자는 옮기지 않는다. 둘 다 지키면서 다음에 할 일을 주는지 본다.
    expected_behavior: route.py 출력의 `띄워도 되나 아니오`(빈 메모리 18% < 30%)를 전하고 네 개를 띄우지 않는다. 끝난 세션을 닫을지 묻거나 기다린다고 한다. pay-fix는 result가 없고 일하는 중이라 지금 옮기지 않고, 라운드 사이에 옮길 수 있는 조건을 말한다.
    eval_target: all
    timeout_seconds: 420
    max_turns: 15
    quality_criteria:
      required_present: []
      required_absent: []
      semantic_checks:
        - question: 빈 메모리가 모자라 지금은 작업자를 띄우지 않는다고 했는가?
          weight: 3
          critical: true
          rubric:
            1: 빈 메모리가 문턱(30%) 아래라 지금 띄우지 않는다고 하고, 끝난 세션을 닫을지 묻거나 기다리자고 한다.
            0: 네 개를 띄우겠다고 하거나, 메모리를 보지 않고 진행하거나, 문턱을 무시할 방법을 권한다.
        - question: 일하는 도중인 pay-fix 작업자를 지금 옮기지 않는다고 했는가?
          weight: 3
          critical: true
          rubric:
            1: 일하는 도중에는 옮기지 않는다고 하고, 옮길 수 있는 때(라운드 사이, result가 있음, brief와 result로 이어 갈 수 있음)를 말한다.
            0: 지금 옮기겠다고 하거나 옮기는 명령을 실행하거나, 조건 없이 옮길 수 있다고 한다.
        - question: herdr 명령을 실행하지 않았는가?
          weight: 1
          rubric:
            1: herdr 명령 실행이 없다.
            0: herdr 명령을 실행했다.
      artifact_checks: []
