<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이해 확인</title>
<!-- into test 모드 템플릿. 아래 QUIZ 데이터만 채운다(페이지 제목도 QUIZ.title로 정해진다). 동작 코드는 고치지 않는다. 외부 요청을 추가하지 않는다. -->
<style>
:root{--bg:#fafaf8;--fg:#1d1d1f;--muted:#5d6168;--line:#c8cbd0;--card:#fff;--accent:#2563c9;--ok:#1a7f45;--ok-bg:#e3f4ea;--ng:#b3261e;--ng-bg:#fbe7e5;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#131416;--fg:#ececec;--muted:#a3a7ae;--line:#43474e;--card:#1c1e21;--accent:#7ea7ff;--ok:#6fd49a;--ok-bg:#16301f;--ng:#ff8a80;--ng-bg:#3a1a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:760px;margin:0 auto;padding:24px 16px;display:grid;gap:16px}
h1{margin:0;font-size:24px}
h2{margin:6px 0 12px;font-size:19px;line-height:1.4}
p{margin:6px 0}
.kicker{margin:0;font-size:13px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
#fb{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.ok{color:var(--ok)}.ng{color:var(--ng)}
.src{font-size:14px;color:var(--muted)}
.opt .key{font-weight:700;min-width:1.2em}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;border:1px solid var(--line);padding:0 4px;border-radius:4px}
.notice{display:inline-block;margin:0 0 6px;padding:2px 8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px}
.notice[hidden]{display:none}
</style>
</head>
<body>
<main>
  <header>
    <p class="notice" id="notice" hidden></p>
    <p class="kicker">into test · 먼저 예측하고, 그다음 답을 본다</p>
    <h1 id="title"></h1>
    <p class="muted" id="meta"></p>
  </header>
  <section id="card" class="card"></section>
  <section id="done" class="card" hidden></section>
</main>
<script>
// ===== 여기만 채운다 =====
const QUIZ = {
  title: "{{주제}} 이해 확인",
  notice: "",   // 비공개 원문이면 "비공개 원문 기반 — 공유 전 이름·경로 확인". 공개 원문이면 빈 문자열
  source: "{{원문 링크·경로}}",
  scope: "{{읽은 범위}}",   // 비공개 안내를 여기에 넣지 않는다
  missing: "{{이 퀴즈가 다루지 않은 디테일}}",
  questions: [
    { section: "TL;DR", type: "choice", q: "{{질문}}",
      options: ["{{보기}}", "{{보기}}", "{{보기}}"], answer: 0,
      explain: "{{A가 정답인 이유 + B·C가 틀린 이유}}", source: "{{근거 위치}}" },
    { section: "왜 중요한가", type: "predict", q: "{{질문}}",
      model: "{{모범 답}}", explain: "{{채점 기준: 필수 ① … ② …}}", source: "{{근거 위치}}" }
  ]
};
// ===== 동작 코드 (고치지 않는다) =====
(function(){
  const $ = s => document.querySelector(s);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>");
  const letter = j => String.fromCharCode(65 + j);
  const all = () => QUIZ.questions.map((_, k) => k);
  let order = [], pos = 0, results = {};

  function render(){
    const k = order[pos], q = QUIZ.questions[k], card = $("#card");
    card.innerHTML =
      `<p class="kicker">${pos + 1} / ${order.length} · ${esc(q.section)}</p><h2>${fmt(q.q)}</h2>` +
      (q.type === "choice"
        ? `<p class="muted">먼저 고르세요. 고르기 전에는 답이 보이지 않습니다.</p>` +
          q.options.map((o, j) => `<label class="opt"><input type="radio" name="o" value="${j}"><span class="key">${letter(j)}</span><span>${fmt(o)}</span></label>`).join("")
        : `<p class="muted">먼저 내 말로 예측해 쓰세요. 쓰기 전에는 답이 보이지 않습니다.</p><textarea id="pred" rows="4"></textarea>`) +
      `<div class="row"><button id="check" disabled>확인</button></div><div id="fb" hidden></div>`;
    const check = $("#check");
    card.oninput = card.onchange = () => {
      check.disabled = q.type === "choice" ? !card.querySelector("input:checked") : !$("#pred").value.trim();
    };
    check.onclick = () => {
      card.oninput = card.onchange = null;
      card.querySelectorAll("input,textarea").forEach(el => el.disabled = true);
      check.hidden = true;
      const fb = $("#fb"); fb.hidden = false;
      if (q.type === "choice") {
        const pick = Number(card.querySelector("input:checked").value), ok = pick === q.answer;
        card.querySelectorAll(".opt").forEach((el, j) => {
          el.classList.toggle("right", j === q.answer);
          el.classList.toggle("wrong", j === pick && !ok);
        });
        fb.innerHTML = `<p class="${ok ? "ok" : "ng"}"><b>${ok ? "정답" : "오답"}</b> · 정답 ${letter(q.answer)}</p><p>${fmt(q.explain)}</p><p class="src">근거: ${fmt(q.source)}</p>`;
        finish(k, ok, fb);
      } else {
        fb.innerHTML = `<p><b>모범 답</b> ${fmt(q.model)}</p><p class="muted">채점 기준: ${fmt(q.explain)}</p><p class="src">근거: ${fmt(q.source)}</p>` +
          `<p>내 예측은?</p><div class="row" id="self"><button data-v="1">맞았다</button><button data-v="0" class="ghost">틀렸다</button></div>`;
        fb.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
          const ok = b.dataset.v === "1";
          $("#self").outerHTML = `<p class="${ok ? "ok" : "ng"}"><b>${ok ? "맞음으로 표시" : "틀림으로 표시"}</b></p>`;
          finish(k, ok, fb);
        });
      }
    };
  }

  function finish(k, ok, fb){
    results[k] = ok;
    const row = document.createElement("div"); row.className = "row";
    const next = document.createElement("button");
    next.textContent = pos + 1 < order.length ? "다음 문제" : "결과 보기";
    next.onclick = () => { pos++; pos < order.length ? render() : done(); };
    row.appendChild(next); fb.appendChild(row); next.focus();
  }

  function done(){
    const total = QUIZ.questions.length;
    const right = all().filter(k => results[k] === true).length;
    const wrong = all().filter(k => results[k] === false);
    $("#card").hidden = true;
    const d = $("#done"); d.hidden = false;
    d.innerHTML = `<h2>${right} / ${total} 맞힘</h2>` +
      (wrong.length
        ? `<p>틀린 문항</p><ol>${wrong.map(k => `<li>[${esc(QUIZ.questions[k].section)}] ${fmt(QUIZ.questions[k].q)}</li>`).join("")}</ol>`
        : `<p>모두 맞혔습니다.</p>`) +
      (QUIZ.missing ? `<p class="src">빠진 디테일: ${fmt(QUIZ.missing)}</p>` : "") +
      `<p class="src">출처: ${fmt(QUIZ.source)}${QUIZ.scope ? " · 읽은 범위: " + fmt(QUIZ.scope) : ""}</p>` +
      `<div class="row">${wrong.length ? `<button id="retry">틀린 문제만 다시</button>` : ""}<button id="reset" class="ghost">처음부터</button></div>`;
    if (wrong.length) $("#retry").onclick = () => start(wrong);
    $("#reset").onclick = () => { results = {}; start(all()); };
  }

  function start(list){
    order = list; pos = 0;
    $("#done").hidden = true; $("#card").hidden = false;
    render();
  }

  if (QUIZ.notice) { $("#notice").textContent = QUIZ.notice; $("#notice").hidden = false; }
  $("#title").textContent = document.title = QUIZ.title;
  $("#meta").textContent = "원문: " + QUIZ.source + (QUIZ.scope ? " · 읽은 범위: " + QUIZ.scope : "");
  start(all());
})();
</script>
</body>
</html>
