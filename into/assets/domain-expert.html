<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도메인 전문가 과정</title>
<!-- into domain-expert 모드 템플릿. scripts/build_domain.py가 아래 COURSE 자리에 curriculum.json을 넣는다. 동작 코드는 고치지 않는다. 외부 요청을 추가하지 않는다. -->
<style>
:root{--bg:#f6f6f3;--fg:#1d1d1f;--muted:#5d6168;--line:#d4d7db;--card:#fff;--accent:#2563c9;--accent-bg:#e7effc;--ok:#1a7f45;--ok-bg:#e3f4ea;--ng:#b3261e;--warn:#8a5a00;--warn-bg:#fbf0d9;
  --l1:#1a7f45;--l2:#2563c9;--l3:#7a3fc4;--l4:#b3421e;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#131416;--fg:#ececec;--muted:#a3a7ae;--line:#3a3d43;--card:#1c1e21;--accent:#7ea7ff;--accent-bg:#1d2840;--ok:#6fd49a;--ok-bg:#16301f;--ng:#ff8a80;--warn:#f0c36a;--warn-bg:#33290f;--l1:#6fd49a;--l2:#7ea7ff;--l3:#c49bff;--l4:#ff9e7a}}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--fg);line-height:1.6;font-size:16px;word-break:keep-all;overflow-wrap:anywhere;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:18px 12px;background:var(--card)}
nav .name{font-weight:800;font-size:17px;line-height:1.35;margin:0 8px}
nav .pct{margin:8px 8px 14px;font-size:13px;color:var(--muted)}
nav .bar{margin-top:6px}
nav h2{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:16px 8px 4px;font-weight:700}
nav a{display:flex;gap:8px;align-items:baseline;padding:7px 8px;border-radius:8px;color:inherit;text-decoration:none;font-size:14px;line-height:1.4}
nav a[aria-current=page]{background:var(--accent-bg);color:var(--accent);font-weight:700}
nav a .dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);transform:translateY(1px)}
nav a .dot.part{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
nav a .dot.done{background:var(--ok);border-color:var(--ok)}
nav a .tag{margin-left:auto;font-size:11px;color:var(--warn);white-space:nowrap}
main{padding:28px 32px 80px;max-width:1080px;width:100%;margin:0 auto;display:grid;gap:22px;align-content:start;min-width:0}
h1{margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.3;letter-spacing:-.01em}
h2{margin:0;font-size:21px;line-height:1.4}
h3{margin:0;font-size:17px;line-height:1.45}
p{margin:0}
ul,ol{margin:0;padding-left:20px}
li{margin:3px 0}
a{color:var(--accent)}
.kicker{font-size:13px;font-weight:700;color:var(--accent);margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.notice{display:inline-block;padding:2px 8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;justify-self:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;display:grid;gap:10px;align-content:start}
.vision{border-left:4px solid var(--accent);padding:4px 0 4px 18px;font-size:clamp(19px,2.2vw,24px);line-height:1.5;font-weight:600}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.four{display:grid;gap:0;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.four>div{padding:14px 18px;border-top:1px solid var(--line)}
.four>div:nth-child(-n+2){border-top:0}
.four>div:nth-child(even){border-left:1px solid var(--line)}
.lab{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
.nw{white-space:nowrap}
.stack td:first-child{min-width:132px}
td details,td details[open]{border:0;background:none;padding:0}
td details summary{padding:0;font-weight:400}
[hidden]{display:none!important}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
button,.btn{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
@media (prefers-color-scheme:dark){button,.btn{color:#10131a}}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=number]{font:inherit;width:76px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.mode{color:var(--accent);border-color:var(--accent)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.ng{color:var(--ng);border-color:var(--ng)}.chip.mix{color:var(--warn);border-color:var(--warn)}
.chip.on{background:var(--accent-bg)}
.road{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.lv{display:grid;gap:8px;align-content:start}
.lv>b{font-size:15px;border-bottom:3px solid var(--c);padding-bottom:5px}
.lv a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;font-size:14px;line-height:1.45}
.lv a:hover{border-color:var(--accent)}
.lv a span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lesson:first-of-type{border-top:0}
.lesson .why{grid-column:2;color:var(--muted);font-size:14px}
.lesson .act{grid-row:1/3;grid-column:3;display:flex;gap:6px;align-items:center}
.lesson input,.rub input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.rub label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.rub input{margin-top:4px}
.rub .ev{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px 28px}.rub .ev select,.rub .ev input{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);height:auto;width:auto;margin:0}.rub .ev input{flex:1;min-width:180px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details>*+*{margin-top:8px}
pre{margin:0;white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--accent-bg);padding:0 4px;border-radius:4px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--ng);font-weight:700}
.next{font-size:18px;font-weight:600;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.src{font-size:13px;color:var(--muted)}
#reader{position:fixed;inset:0;background:var(--bg);display:none;grid-template-rows:auto minmax(0,1fr);z-index:9}
#reader.on{display:grid}
#reader header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
#reader header b{min-width:0;flex:1;font-size:15px;line-height:1.35}
#reader iframe{width:100%;height:100%;border:0;background:var(--card)}
#reader video{width:100%;height:100%;background:#000}
.doc{overflow:auto;padding:24px 18px 60px}
.doc>div{max-width:820px;margin:0 auto;display:grid;gap:12px}
.doc h1{font-size:26px}.doc h2{margin-top:14px}.doc h3{margin-top:8px}
.doc img{max-width:100%;background:#fff;border-radius:8px;padding:8px}
.doc blockquote{margin:0;border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.mnav{display:none}
@media (max-width:900px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}nav{display:none}.mnav{display:block;position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px}.mnav select{font:inherit;width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}main{padding:18px 16px 60px}.road{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:minmax(0,1fr)}.four>div{border-left:0!important}.four>div:nth-child(2){border-top:1px solid var(--line)}.lesson{grid-template-columns:auto minmax(0,1fr)}.lesson .act{grid-column:2;grid-row:auto}}
@media (max-width:520px){.road{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.stack thead{display:none}.stack,.stack tbody,.stack tr,.stack td{display:block;width:auto}.stack tr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--card)}.stack td{border:0;padding:3px 0}.stack td[data-l]::before{content:attr(data-l);display:block;font-size:13px;font-weight:700;color:var(--muted)}.stack .nw{display:inline-block;margin-right:14px}.stack .nw[data-l]::before{display:inline;margin-right:8px}}
@media print{nav,.mnav,#reader{display:none!important}body{display:block}}
</style>
</head>
<body>
<nav id="nav" aria-label="과정 목차"></nav>
<div class="mnav"><select id="msel" aria-label="과정 목차"></select></div>
<main id="main"></main>
<div id="reader" role="dialog" aria-modal="true" aria-label="레슨"><header><span class="chip mode" id="rmode"></span><b id="rtitle"></b><a class="btn ghost" id="rtab" target="_blank" rel="noopener">새 탭</a><button id="rdone">다 봤다</button><button class="ghost" id="rclose">닫기 (Esc)</button></header><div id="rbody" style="min-height:0;display:grid"></div></div>
<script type="application/json" id="course">/*COURSE*/</script>
<script>
(function(){
const C = JSON.parse(document.getElementById("course").textContent);
const $ = s => document.querySelector(s), el = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const REF = {}; C.sources.forEach(x => [x.id].concat(x.aka || []).forEach(k => { if (/^[A-Za-z]{1,6}\d{1,3}$/.test(k) && !C.levels.some(l => l.sections.some(y => y.id === k)) && !C.kpis.some(y => y.id === k)) REF[k] = x.id; }));
const ref = t => fmt(t).replace(/(<code>.*?<\/code>)|\b([A-Za-z]{1,6}\d{1,3})\b/g, (m, c, k) => c || (REF[k] ? `<a href="#src:${REF[k]}">${k}</a>` : m)).replace(/<code>(research\/[^<>"':]+\.md)((?::\d+(?:[–-]\d+)?)?)<\/code>/g, '<a href="$1" target="_blank" rel="noopener"><code>$1$2</code></a>');
const KEY = "into-domain:" + C.slug;
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
["les","rub","quiz","kpi","ev"].forEach(k => S[k] = S[k] || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const LV = ["--l1","--l2","--l3","--l4"];
const secs = [].concat(...C.levels.map((l, i) => l.sections.map(s => Object.assign(s, {lv: l, li: i}))));
const sec = id => secs.find(s => s.id === id);
const FIN = C.capstone, DEL = secs.map(s => [s.id, s.deliverable]).concat([["capstone", FIN]]);
const rt = x => typeof x === "string" ? x : x.t, must = x => typeof x === "object" && !!x.must;
const ev = (id, i) => { const e = (S.ev[id] || [])[i]; return e && typeof e === "object" ? e : {k: "", t: ""}; };
const hit = (id, x, i) => !!(S.rub[id] || [])[i] && (!must(x) || !!(ev(id, i).k && ev(id, i).t.trim().length >= 10 && /\d/.test(ev(id, i).t) && (ev(id, i).t.match(/[·,;|]/g) || []).length >= 2));
const mock = () => DEL.some(([id, d]) => d.rubric.some((x, i) => must(x) && ev(id, i).k === "모의"));
const hits = (id, d) => d.rubric.filter((x, i) => hit(id, x, i)).length;
const pass = (id, d) => hits(id, d) >= d.pass && d.rubric.every((x, i) => !must(x) || hit(id, x, i));
const qk = id => id === "final" && C.final.rev ? "final@" + C.final.rev : id;
const q = id => S.quiz[qk(id)] || null;
const gateOk = s => { const r = q(s.id); return !!(r && r.best >= s.gate.pass); };
const done = s => gateOk(s) && pass(s.id, s.deliverable);
const started = s => !!q(s.id) || (S.rub[s.id] || []).some(Boolean) || s.lessons.some((_, i) => S.les[s.id + ":" + i]);
const pct = r => r && r.total ? Math.round(r.first / r.total * 100) : null;
const tag = id => { const r = q("diag"); if (!r || !r.parts) return ""; const k = Object.keys(r.parts).find(x => x.split(/\s/)[0] === id); if (!k) return ""; const [a, b] = r.parts[k]; return a === b ? "게이트 먼저" : a === 0 ? "먼저 보기" : "다시 보기"; };
const kpiVal = k => {
  if (k.source === "exam") { const b = pct(q("diag")), f = q("final"); return {base: b, cur: f ? Math.round(f.first / f.total * 100) : b}; }
  if (k.source === "gates") return {base: 0, cur: secs.filter(gateOk).length};
  if (k.source === "deliverables") return {base: 0, cur: DEL.filter(([i, d]) => pass(i, d)).length};
  const v = S.kpi[k.id] || {}; return {base: v.base == null ? null : v.base, cur: v.cur == null ? (v.base == null ? null : v.base) : v.cur};
};
const prog = (k, v) => { if (v.cur == null) return 0; const b = v.base == null ? (k.dir === "down" ? v.cur : 0) : v.base; if (k.dir === "down") return v.cur <= k.target ? 100 : b > k.target ? Math.max(0, (b - v.cur) / (b - k.target) * 100) : 0; return Math.max(0, Math.min(100, v.cur / k.target * 100)); };
const kMax = k => k.max || +((String(k.unit).match(/\/\s*(\d+)/) || [])[1] || 0);
const okNum = (k, x) => x != null && x >= 0 && (!kMax(k) || (x <= kMax(k) && Number.isInteger(x))) && (Number.isInteger(x) || !/^\s*(개|건|회|번|명|곳|장|편|문항)/.test(String(k.unit)));
const kOk = k => { const v = k.source === "manual" ? (S.kpi[k.id] || {}).cur : kpiVal(k).cur, b = (S.kpi[k.id] || {}).base; if (k.source === "manual" && !(okNum(k, b) && okNum(k, v))) return false; return v != null && (k.dir === "down" ? v <= k.target : v >= k.target); };
const late = () => !!(q("diag") && q("final") && q("diag").at > q("final").at), finOk = () => !!(q("diag") && q("final") && !late() && q("final").first >= C.final.pass), real = C.kpis.filter(k => k.source === "manual");
const all4 = () => secs.every(done) && finOk() && pass("capstone", FIN) && real.every(kOk), grad = () => all4() && !mock(), drill = () => !grad() && mock() && secs.every(done) && finOk() && pass("capstone", FIN);
const gradList = () => `<ul>${[[secs.every(done), `섹션 ${secs.filter(done).length}/${secs.length}개 통과(게이트 + 결과물)`], [finOk(), `진단을 보고 졸업 시험 첫 점수 ${C.final.pass}/${C.final.total}${!q("diag") ? " — 진단을 아직 보지 않았다(앞뒤를 잴 수 없다)" : late() ? " — 졸업 시험을 진단보다 먼저 봤다(새 문제가 필요하다)" : ""}${q("final") && q("final").first < C.final.pass ? ` — 첫 점수 ${q("final").first}. 같은 문제를 다시 푼 점수는 세지 않는다. <code>into domain-expert ${esc(C.slug)}, 졸업 시험만 새 문제로</code>` : ""}`], [pass("capstone", FIN), `졸업 과제 채점표 ${FIN.pass}/${FIN.rubric.length}${FIN.rubric.some(must) ? " + 필수 항목의 증거" : ""}`], [real.every(kOk), `직접 잰 지표 ${real.filter(kOk).length}/${real.length}개 목표 도달(시작값과 지금 값을 모두 잼)`], [DEL.every(([id, d]) => d.rubric.every((x, i) => !must(x) || ev(id, i).k === "실제")), `필수 증거가 모두 실제다${mock() ? " — 모의가 있으면 연습 완료이고 졸업이 아니다" : ""}`]].map(([o, t]) => `<li>${o ? `<span class="pass">✓</span>` : "○"} ${t}</li>`).join("")}</ul>`;
const hours = () => secs.reduce((a, s) => a + s.hours, 0) + (C.diag.hours || 0) + (C.final.hours || 0) + (FIN.hours || 0);
const chip = r => `<span class="chip ${r === "성공" ? "ok" : r === "실패" ? "ng" : "mix"}">${esc(r)}</span>`;
const MODE = {eli5:"ELI5",ste:"STE",doc:"문서",html:"HTML 한 장",interactive:"눌러 보기",slides:"슬라이드",test:"퀴즈",shorts:"쇼츠",video:"영상",source:"원문"};

function nav(cur){
  const n = secs.filter(done).length, p = Math.round(n / secs.length * 100);
  const a = (id, t, dot, tg) => `<a href="#${id}"${cur === id ? ' aria-current="page"' : ""}>${dot ? `<span class="dot ${dot}"></span>` : ""}<span>${t}</span>${tg ? `<span class="tag">${tg}</span>` : ""}</a>`;
  const list = [["home","비전 · 지표 · 로드맵"],["diag","진단 시험"]];
  let h = `<p class="name">${esc(C.domain)}<br>전문가 과정</p><div class="pct">섹션 ${n}/${secs.length} 완료<div class="bar ok"><i style="width:${p}%"></i></div></div>`;
  h += a("home", "비전 · 지표 · 로드맵") + a("diag", "진단 시험", q("diag") ? "done" : "none");
  C.levels.forEach(l => { h += `<h2>${esc(l.name)} · ${esc(l.title)}</h2>` + l.sections.map(s => { list.push([s.id, `${s.id} ${s.title}`]); return a(s.id, `${s.id}. ${esc(s.title)}`, done(s) ? "done" : started(s) ? "part" : "none", done(s) ? "" : tag(s.id)); }).join(""); });
  h += `<h2>졸업</h2>` + a("final", "졸업 시험 · 졸업 과제", grad() ? "done" : q("final") || (S.rub.capstone || []).some(Boolean) ? "part" : "none");
  h += `<h2>자료</h2>` + ((C.cases || []).length ? a("cases", `사례 ${C.cases.length}개 (성공 · 실패)`) : "") + a("sources", `출처 ${C.sources.length}개`);
  list.push(["final","졸업 시험 · 졸업 과제"]); if ((C.cases || []).length) list.push(["cases","사례"]); list.push(["sources","출처"]);
  el("nav").innerHTML = h;
  el("msel").innerHTML = list.map(([i, t]) => `<option value="${i}"${i === cur ? " selected" : ""}>${esc(t)}</option>`).join("");
}
el("msel").onchange = e => location.hash = e.target.value;

function raisers(k){
  const r = secs.filter(s => s.kpi.some(x => x.id === k.id)), a = r.map(s => `<a href="#${s.id}">${s.id}</a>`).join(" ");
  if (!r.length || r.length === secs.length) return `<span class="small muted">올리는 섹션: 전체</span>`;
  return r.length > 5 ? `<details class="small muted"><summary>올리는 섹션 ${r.length}개</summary>${a}</details>` : `<span class="small muted">올리는 섹션: ${a}</span>`;
}
function kpiTable(){
  return `<div class="scroll"><table class="stack"><thead><tr><th>지표</th><th>비전과 어떻게 이어지나</th><th>재는 법</th><th>시작</th><th>지금</th><th>목표</th><th></th></tr></thead><tbody>` + C.kpis.map(k => {
    const v = kpiVal(k), m = k.source === "manual", u = esc(k.unit), f = x => x == null ? "—" : x + u, p = prog(k, v);
    const inp = (w, x) => m ? `<input type="number" min="0" ${kMax(k) ? `max="${kMax(k)}" step="1"` : `step="any"`} data-kpi="${k.id}" data-w="${w}" value="${x == null ? "" : x}" aria-label="${esc(k.name)} ${w === "base" ? "시작값" : "지금 값"}">${u}` : f(x);
    return `<tr><td><span class="small muted nw">${esc(k.id)}</span> <b>${fmt(k.name)}</b><br>${raisers(k)}</td><td data-l="비전과 연결">${fmt(k.why)}</td><td data-l="재는 법">${fmt(k.measure)}${k.how ? `<details class="small"><summary>자세히</summary><div style="white-space:pre-line">${fmt(k.how)}</div></details>` : ""}</td><td class="nw" data-l="시작">${inp("base", v.base)}</td><td class="nw" data-l="지금">${inp("cur", v.cur)}</td><td class="nw" data-l="목표"><b>${k.dir === "down" ? "≤ " : ""}${k.target}${u}</b></td><td style="min-width:90px"><div class="bar ${p >= 100 ? "ok" : ""}"><i style="width:${p}%"></i></div></td></tr>`;
  }).join("") + `</tbody></table></div>`;
}

const proofs = () => C.proof && C.proof.length ? `<section class="card"><span class="lab">비전의 행동마다 남는 증거</span><ul>${C.proof.map(x => `<li><b>${fmt(x.act)}</b> → ${fmt(x.by)}${x.need ? ` <span class="small muted">· 빠지면 졸업이 막힌다: ${x.need.map(n => { const [i, k] = n.split(":"), o = k ? hit(i, (i === "capstone" ? FIN : sec(i).deliverable).rubric[k - 1], k - 1) : kOk(C.kpis.find(y => y.id === i)); return `${o ? "✓" : "○"} ${k ? (i === "capstone" ? "졸업 과제 " : esc(i) + " 결과물 ") + k + "번" : esc((C.kpis.find(y => y.id === i) || {}).name)}`; }).join(" · ")}</span>` : ""}</li>`).join("")}</ul></section>` : "";
function home(){
  const hpw = S.hpw || 5, H = hours(), one = C.onepage, due = q("diag") ? real.filter(k => (S.kpi[k.id] || {}).base == null && (!k.start || done(sec(k.start)))) : [];
  const next = !q("diag") ? ["diag", "진단 시험부터 본다"] : (() => { const rat = x => { const r = q("diag"), k = r && r.parts && Object.keys(r.parts).find(y => y.split(/\s/)[0] === x.id); return k ? r.parts[k][0] / r.parts[k][1] : 1; }; const c = secs.filter(x => !done(x) && (x.needs || []).every(n => done(sec(n)))).sort((a, b) => rat(a) - rat(b)), s = c[0] || secs.find(x => !done(x)); return s ? [s.id, `${s.id}. ${s.title}${tag(s.id) ? " (진단: " + tag(s.id) + ")" : ""}`] : ["final", "졸업 시험 · 졸업 과제"]; })();
  return (C.notice ? `<p class="notice">${esc(C.notice)}</p>` : "") +
  `<header style="display:grid;gap:8px"><p class="kicker">into domain-expert · 기준일 ${esc(C.asof)}</p><h1>${esc(C.domain)}<br>전문가가 되는 과정</h1><p class="muted">${fmt(C.learner)}</p></header>
  <section style="display:grid;gap:10px"><span class="lab" style="margin:0">비전 — 이 도메인의 전문가가 된다는 것</span><p class="vision">${fmt(C.vision)}</p></section>
  <section class="grid2"><div class="card"><span class="lab">전략</span><p>${fmt(C.strategy)}</p></div><div class="card"><span class="lab">목표</span><p>${fmt(C.goal)}</p><details class="small"><summary>졸업 조건</summary>${gradList()}</details></div></section>
  ${proofs()}
  <div class="next" style="border-top:0;padding-top:0">${due.length ? `<button data-go="kpis">먼저 시작값 재기 · ${due.map(k => fmt(k.name)).join(" · ")}</button>` : ""}<a class="btn${due.length ? " ghost" : ""}" href="#${next[0]}">이어서 하기 · ${esc(next[1])}</a><span class="small muted">전체 약 ${Math.round(H)}시간(에이전트 추정) · 주 <input type="number" id="hpw" min="1" max="60" value="${hpw}" aria-label="주당 시간"> 시간이면 약 <b id="wk">${Math.ceil(H / hpw)}</b>주</span></div>
  ${real.some(k => (S.kpi[k.id] || {}).base == null) ? `<p class="small"><b>시작값을 아직 안 잰 지표:</b> ${real.filter(k => (S.kpi[k.id] || {}).base == null).map(k => fmt(k.name) + (k.start ? `(${esc(k.start)} 뒤에)` : "")).join(" · ")}. ${real.some(k => k.start) ? "괄호가 없는 지표는 " : ""}첫 섹션 전에 아래 표의 재는 법대로 재서 적는다. 나중에는 시작값을 다시 만들 수 없다.</p>` : ""}
  <section id="kpis" style="display:grid;gap:10px"><h2>지표 — 비전에 얼마나 가까워졌나</h2><p class="muted small">시험·게이트·결과물 지표는 저절로 찬다. 나머지는 잰 값을 적는다. 값은 이 브라우저에만 저장된다.</p>${kpiTable()}</section>
  <section style="display:grid;gap:10px"><h2>로드맵</h2><div class="road">${C.levels.map((l, i) => `<div class="lv" style="--c:var(${LV[i]})"><b>${esc(l.name)} · ${esc(l.title)}</b><p class="small muted">${fmt(l.promise)}</p>${l.sections.map(s => `<a href="#${s.id}">${done(s) ? "✓ " : ""}${s.id}. ${esc(s.title)}<span>결과물: ${fmt(s.deliverable.what)}</span></a>`).join("")}</div>`).join("")}</div>
  <div class="card"><h3>졸업 과제</h3><p>${fmt(FIN.what)}</p><p class="small muted">통과 기준: 채점표 ${FIN.rubric.length}개 중 ${FIN.pass}개${FIN.rubric.some(must) ? `(필수 ${FIN.rubric.filter(must).length}개 포함)` : ""} + 졸업 시험 ${C.final.pass}/${C.final.total}</p><div class="row"><a class="btn ghost" href="#final">졸업 조건 보기</a></div></div></section>
  ${one ? `<section class="card"><h2>도메인 한 장</h2>${[["TL;DR","tldr"],["왜 중요한가","why"],["High-level design","hld"],["Low-level design","lld"],["Insights","insights"]].map(([t, k]) => `<div><span class="lab">${t}</span>${Array.isArray(one[k]) ? `<ul>${one[k].map(x => `<li>${fmt(x)}</li>`).join("")}</ul>` : k === "hld" || k === "lld" ? `<pre>${esc(one[k])}</pre>` : `<p>${fmt(one[k])}</p>`}</div>`).join("")}</section>` : ""}
  <section class="card"><h3>이 과정이 약속하지 않는 것</h3><p>${fmt(C.honesty)}</p><div class="row"><button class="ghost" id="exp">진행 내보내기</button><button class="ghost" id="imp">진행 불러오기</button><button class="ghost" id="rst">처음부터</button></div><textarea id="dump" hidden rows="4" style="width:100%;font:13px ui-monospace,monospace" aria-label="진행 데이터"></textarea></section>
  <p class="src">빠진 디테일: ${fmt(C.missing)}<br>출처: ${fmt(C.source_line)}</p>`;
}

function quizCard(id, g, label){
  const r = q(id);
  return `<div class="row">${g.file ? `<button data-open="quiz:${id}">${label}</button>` : `<pre style="flex:1">${esc(g.cmd || "into test")}</pre>`}${r ? `<span>처음 <b>${r.first}/${r.total}</b> · 가장 높은 점수 <b>${r.best}/${r.total}</b> ${g.pass ? ((id === "final" ? r.first : r.best) >= g.pass ? `<span class="pass">통과</span>` : `<span class="fail">아직 (기준 ${g.pass}/${g.total})</span>`) : ""}</span>` : `<span class="muted">${g.pass ? `통과 기준 ${g.pass}/${g.total} · ` : ""}전체를 한 번에 푼 점수만 저장된다</span>`}</div>`;
}

function gp(id, d){

  ${s.sources && s.sources.length ? `<p class="src">이 섹션의 출처: ${s.sources.map(x => `<a href="#src:${esc(x)}">${esc(x)}</a>`).join(" · ")}</p>` : ""}
  <div class="next"><span>${fmt(s.ask || "")}</span>${nx ? `<a class="btn" href="#${nx.id}">${nx.id}. ${esc(nx.title)}</a>` : `<a class="btn" href="#final">졸업 시험 · 졸업 과제</a>`}</div>`;

function diag(){

  return `<header style="display:grid;gap:6px"><p class="kicker">시작</p><h1>진단 시험</h1><p class="muted">${fmt(C.diag.note)}</p></header><section class="card">${quizCard("diag", C.diag, "진단 시험 풀기")}${r && r.parts ? `<div class="scroll"><table><thead><tr><th>섹션</th><th>맞힘</th><th>권하는 길</th></tr></thead><tbody>${Object.keys(r.parts).map(k => { const [a, b] = r.parts[k], id = k.split(/\s/)[0]; return `<tr><td>${sec(id) ? `<a href="#${id}">${esc(k)}</a>` : esc(k)}</td><td>${a}/${b}</td><td>${a === b ? (b < 2 ? "한 문항뿐이라 약한 신호다. 게이트를 먼저 풀고, 떨어지면 레슨을 본다" : "게이트를 먼저 풀고 결과물을 만든다") : a === 0 ? "쉬운 레슨부터 차례로 본다" : "틀린 곳의 레슨을 본다"}</td></tr>`; }).join("")}</tbody></table></div>` : ""}</section>`;

}
let cf = {r: "", z: ""};

  <div class="row"><span class="small muted">결과</span>${["", ...rs].map(v => b("r", v, cnt("r", v))).join("")}</div><div class="row"><span class="small muted">규모</span>${["", ...zs].map(v => b("z", v, cnt("z", v))).join("")}</div>

let sf = "";
function sources(){
  const ts = [...new Set(C.sources.map(s => s.type))];
  return `<header style="display:grid;gap:6px"><h1>출처</h1><p class="muted">근거 등급: A 동료 심사·무작위 실험·공식 통계·공개 벤치마크·코드 원문·명세와 법령이 스스로 정한 규칙 / B 당사자가 스스로 밝힌 값, 코드에서 뽑은 2차 정리 / C 설문·컨설팅·언론 / D 의견·예측. 아무도 검증하지 않은 값을 A로 올리지 않는다.</p></header>
  <div class="row">${["", ...ts].map(t => `<button class="ghost" data-sf="${esc(t)}" aria-pressed="${sf === t}" style="${sf === t ? "background:var(--accent-bg)" : ""}">${esc(t || "전체")} ${C.sources.filter(s => !t || s.type === t).length}</button>`).join("")}</div>
  <div class="scroll"><table class="stack"><thead><tr><th>id</th><th>출처</th><th>종류</th><th>등급</th><th>무엇을 말하나 · 조건</th></tr></thead><tbody>${C.sources.filter(s => !sf || s.type === sf).map(s => `<tr id="src-${esc(s.id)}"><td><b class="nw">${esc(s.id)}</b>${s.aka && s.aka.length ? `<br><span class="small muted">${esc(s.aka.join(" "))}</span>` : ""}</td><td>${s.hold && !q("final") ? `<span class="muted">졸업 시험 전용</span>` : s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${fmt(s.title)}</a>` : fmt(s.title)}<br><span class="small muted">${esc(s.date || "")}</span></td><td class="nw" data-l="종류">${esc(s.type)}</td><td class="nw" data-l="등급">${esc(s.grade)}</td><td>${s.hold && !q("final") ? `<span class="muted">졸업 시험을 푼 뒤에 보인다</span>` : fmt(s.finding)}${s.limit && !(s.hold && !q("final")) ? `<br><span class="small muted">한계: ${fmt(s.limit)}</span>` : ""}</td></tr>`).join("")}</tbody></table></div>
  ${C.gaps && C.gaps.length ? `<section class="card"><h3>찾지 못했거나 아직 모르는 것</h3><ul>${C.gaps.map(g => `<li>${ref(g)}</li>`).join("")}</ul></section>` : ""}`;
}

function draw(){
  let h = decodeURIComponent(location.hash.slice(1)) || "home"; const go = h.startsWith("src:") ? h.slice(4) : ""; if (go) { h = "sources"; sf = ""; } const s = sec(h);
  nav(h);
  el("main").innerHTML = s ? section(s) : h === "diag" ? diag() : h === "final" ? final() : h === "cases" && C.cases ? cases() : h === "sources" ? sources() : home();
  document.title = (s ? `${s.id}. ${s.title} — ` : "") + C.domain + " 전문가 과정";
  bind();
  const row = go && el("src-" + go); if (row) { row.style.background = "var(--accent-bg)"; setTimeout(() => row.scrollIntoView({block: "center"}), 0); }
}
function bind(){
  const all = (s, f) => document.querySelectorAll("#main " + s).forEach(f);
  all("[data-les]", b => b.onchange = () => { S.les[b.dataset.les] = b.checked; save(); nav(location.hash.slice(1)); });
  all("[data-rub]", b => b.onchange = () => { const k = b.dataset.rub; (S.rub[k] = S.rub[k] || [])[+b.dataset.i] = b.checked; save(); const y = scrollY; draw(); scrollTo(0, y); });
  all("[data-ev]", b => b.onchange = () => { const k = b.dataset.ev; const L = S.ev[k] = S.ev[k] || [], i = +b.dataset.i; L[i] = Object.assign({k: "", t: ""}, typeof L[i] === "object" ? L[i] : {}, {[b.dataset.f]: b.value}); save(); const y = scrollY; draw(); scrollTo(0, y); });
  all("[data-go]", b => b.onclick = () => el(b.dataset.go).scrollIntoView({block: "start"}));
  all("[data-kpi]", b => b.onchange = () => { const k = S.kpi[b.dataset.kpi] = S.kpi[b.dataset.kpi] || {}; const x = b.value === "" ? null : +b.value; k[b.dataset.w] = x == null || okNum(C.kpis.find(y => y.id === b.dataset.kpi), x) ? x : null; save(); const y = scrollY; draw(); scrollTo(0, y); });
  all("[data-open]", b => b.onclick = () => open(b.dataset.open));
  all("[data-cmd]", b => b.onclick = () => copy(b.dataset.cmd, b));
  all("[data-copy]", b => b.onclick = () => { const k = b.dataset.copy; copy(gp(k, k === "capstone" ? FIN : sec(k).deliverable), b); });
  all("[data-cf]", b => b.onclick = () => { cf[b.dataset.cf] = b.dataset.v; draw(); });
  all("[data-sf]", b => b.onclick = () => { sf = b.dataset.sf; draw(); });
  const hp = el("hpw"); if (hp) hp.onchange = () => { S.hpw = Math.max(1, +hp.value || 5); save(); el("wk").textContent = Math.ceil(hours() / S.hpw); };
  const d = el("dump"); if (!d) return;
  el("exp").onclick = () => { d.hidden = false; d.value = JSON.stringify(S); d.select(); };
  el("imp").onclick = () => { if (d.hidden) { d.hidden = false; d.value = ""; d.placeholder = "내보낸 글을 붙여 넣고 다시 누른다"; return; } try { const x = JSON.parse(d.value); S = x; ["les","rub","quiz","kpi"].forEach(k => S[k] = S[k] || {}); save(); draw(); } catch (e) { d.value = "읽을 수 없는 데이터다."; } };
  el("rst").onclick = () => { if (el("rst").textContent === "정말 지운다") { S = {les:{},rub:{},quiz:{},kpi:{},ev:{}}; save(); draw(); } else el("rst").textContent = "정말 지운다"; };
}
function copy(t, b){ const ok = () => { const o = b.textContent; b.textContent = "복사했다"; setTimeout(() => b.textContent = o, 1200); }; const fb = () => { const x = document.createElement("textarea"); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand("copy"); ok(); } catch (e) {} x.remove(); }; if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb(); }

let cur = null, frame = null, back = null;
function open(id){
  let l, title, mode;
  if (id.startsWith("quiz:")) { const k = id.slice(5), g = k === "diag" ? C.diag : k === "final" ? C.final : sec(k).gate; l = g; title = k === "diag" ? "진단 시험" : k === "final" ? "졸업 시험" : `${k} 게이트`; mode = "test"; }
  else { const [a, j] = id.split(":"); l = sec(a).lessons[+j]; title = l.title; mode = l.mode; }
  if (!l.file && l.url) { window.open(l.url, "_blank", "noopener"); return; }
  cur = id; back = document.activeElement; frame = null;
  el("rmode").textContent = MODE[mode] || mode; el("rtitle").textContent = title; el("rtab").href = l.url || l.file; el("rtab").textContent = l.url ? "원문" : "새 탭";
  el("rdone").hidden = el("rtab").hidden = id.startsWith("quiz:");
  if (id.startsWith("quiz:")) { S.open = S.open || {}; S.open[id.slice(5)] = (S.open[id.slice(5)] || 0) + 1; save(); }
  const B = el("rbody");
  if (l.html) B.innerHTML = `<div class="doc" tabindex="0"><div>${l.html}</div></div>`;
  else if (/\.(mp4|webm)$/.test(l.file)) B.innerHTML = `<video controls src="${esc(l.file)}"></video>`;
  else { B.innerHTML = `<iframe title="${esc(title)}" src="${esc(l.file)}"></iframe>`; frame = B.querySelector("iframe"); frame.onload = () => frame.contentWindow.focus(); }
  el("reader").classList.add("on"); document.body.style.overflow = "hidden"; el("rclose").focus();
}
function close(){ el("reader").classList.remove("on"); el("rbody").innerHTML = ""; document.body.style.overflow = ""; frame = null; const y = scrollY; draw(); scrollTo(0, y); if (back && back.isConnected) back.focus(); }
el("rclose").onclick = close;
el("rdone").onclick = () => { S.les[cur] = true; save(); close(); };
addEventListener("keydown", e => { if (e.key === "Escape" && el("reader").classList.contains("on")) close(); });
addEventListener("message", e => {
  const m = e.data; if (!frame || e.source !== frame.contentWindow || !m || m.type !== "into-test" || !m.full || !cur || !cur.startsWith("quiz:")) return;
  const k = qk(cur.slice(5)), r = S.quiz[k];
  S.quiz[k] = r ? Object.assign(r, {best: Math.max(r.best, m.right), total: m.total}) : {first: m.right, best: m.right, total: m.total, parts: m.parts, at: Date.now()};
  save();
});
addEventListener("hashchange", () => { draw(); scrollTo(0, 0); });
draw();
})();
</script>
