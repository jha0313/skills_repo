name: Skill evaluator checks
on:
  pull_request:
    paths: ['skill-evaluator/**', 'eval-writer/**', '.github/workflows/skill-evaluator.yml']
  push:
    paths: ['skill-evaluator/**', 'eval-writer/**', '.github/workflows/skill-evaluator.yml']
permissions:
  contents: read
jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 ruff==0.16.8 mypy==2.3.1 types-PyYAML
      - run: ruff check skill-evaluator/scripts skill-evaluator/tests
      - run: ruff format --check skill-evaluator/scripts skill-evaluator/tests
      - run: mypy --config-file skill-evaluator/pyproject.toml skill-evaluator/scripts
      - run: python -m unittest discover -s skill-evaluator/tests -v
      - name: Validate examples without paid agent calls
        run: |
          python skill-evaluator/scripts/evaluate.py validate skill-evaluator/tests/fixtures/basic.yaml --basic
          python skill-evaluator/scripts/evaluate.py validate skill-evaluator/tests/fixtures/basic-binary.yaml --basic --binary
          python skill-evaluator/scripts/evaluate.py validate skill-evaluator/tests/fixtures/thorough.yaml
